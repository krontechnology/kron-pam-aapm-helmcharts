apiVersion: v1
kind: Secret
metadata:
    name: {{ .Values.secrets.name }}

type: {{ .Values.secrets.type }}

data:
   connection: {{ .Values.secrets.connection | quote }}
   installToken: {{ .Values.secrets.installToken | b64enc | quote }}
   address: {{ .Values.secrets.address | b64enc | quote }}
   failoverAddress: {{ .Values.secrets.failoverAddress | default "" | b64enc | quote }}
   keystorePassword: {{ .Values.secrets.keystorePassword | default "" | toString | b64enc | quote }}

