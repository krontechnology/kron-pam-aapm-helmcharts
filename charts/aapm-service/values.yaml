replicaCount: 1

image:
  repository: krontechnology/aapm-service
  pullPolicy: IfNotPresent
  tag: "1.2.2"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "as-service-account"

podAnnotations: {}
podLabels:
  kron.aapm.service: vault

role:
  name: "aapm-service-access"
  bindingName: "bind-aapm-service-access"

podSecurityContext: {} # fsGroup: 2000

securityContext: {}

tls:
  enabled: false
  keystorePath: "/etc/tls/keystore.p12"
  password: "<your_password>"
  secretName: "grpc-tls-secret"
  keyAlias: "<your_alias>"
  # mTLS client certificate verification. Defaults to need.
  # Set clientAuth: none to disable client cert requirement.
  clientAuth: "need"
  trustStorePath: "/etc/tls/truststore.p12"
  trustStorePassword: ""
  trustStoreSecretName: "grpc-truststore-secret"

agent:
  service: "<your_agent_url>"
  port: "<your_agent_port>"
  disableSecureChannel: false
  ignoreCertificate: false

interceptor:
  disableSecureRequest: false
  ignoreCertificate: false

pam:
  url: "<your_pam_url>"

# Client user credentials — sensitive values (secret, token) are read from
# a pre-existing Kubernetes Secret referenced by clientCredentials.secretName.
# Each user maps to a key in that Secret.
clientCredentials:
  secretName: "aapm-client-credentials"

client:
  enabled: false
  keystoreDir: "/keystore"
  users:
    # VAULT example (static account via gRPC — default):
    - label: "USER1"
      type: "VAULT"          # VAULT | EPHEMERAL_BASE  (default: VAULT)
      accPath: "/"
      secretKey: "user1-secret"   # K8s Secret key for account name
      tokenKey: "user1-token"     # K8s Secret key for token
    # EPHEMERAL_BASE example (JIT account via PAM REST):
    # - label: "USER1-JIT"
    #   type: "EPHEMERAL_BASE"
    #   sapmAccountName: "myBaseAccount"   # base account name in PAM
    #   sapmAccountPath: "/Root/Accounts"  # base account path in PAM
    #   ttlMinutes: 60                     # credential TTL; auto-renewed at 90 % expiry
    #   tokenKey: "user1-token"            # K8s Secret key for app-token

service:
  type: ClusterIP
  port: 8443
  targetPort: 8443
  name: aapm-service

vault:
  allowedAccounts: []
  # - accountName: "my_account"
  #   accountPath: "/my_path"
  # API key for /vault endpoint authentication (X-Vault-Api-Key header).
  # Must reference a pre-existing Kubernetes Secret.
  apiKey:
    secretName: "aapm-vault-secret"
    secretKey: "api-key"

access:
  key: default

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
